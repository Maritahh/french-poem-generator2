<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Norwegian Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Norwegian Poem Generator</h1>
        <main>
          <form>
            <input
              type="text"
              placeholder="Enter the topic of the Norwegian poem"
              autofocus
              required
              autocomplete="off"
              class="instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="poem-output"></div>
        </main>
        <p>
          This AI project generates a Norwegian poem based on your input. It
          uses the OpenAI API to generate the poem.
        </p>
      </header>
      <footer>
        <p>
          This AI project was created by
          <a href="https://github.com/Maritahh" target="_blank"
            >Marita Hamran</a
          >
          and is
          <a
            href="https://github.com/Maritahh/french-poem-generator2"
            target="_blank"
            >open sourced on GitHub</a
          >
          and
          <a
            href="https://norwegian-poem-generator.netlify.app/"
            target="_blank"
            >hosted on Netlify</a
          >
        </p>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
