<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>AI Norwegian Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Norwegian Poem Generator</h1>
      </header>

      <main>
        <form id="poem-generator-form">
          <input
            type="text"
            placeholder="Enter the topic of the Norwegian poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
            id="user-instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="poem" id="poem"></div>
      </main>

      <footer>
        <p>
          This AI project was created by
          <a href="https://github.com/Maritahh" target="_blank"
            >Marita Hamran</a
          >
          and is
          <a
            href="https://github.com/Maritahh/french-poem-generator2"
            target="_blank"
            >open sourced on GitHub</a
          >
          and
          <a
            href="https://norwegian-poem-generator.netlify.app/"
            target="_blank"
            >hosted on Netlify</a
          >
        </p>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
